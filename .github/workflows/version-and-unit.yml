name: ConfluenceBridge version and existing unit tests

on:
  push:
    branches: [main, 'agent/2-version-check']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test without Confluence, browser or heavy PDF dependencies
        shell: bash
        run: |
          python -m pip install pytest
          python -m pytest -q
      - name: Install minimal package entrypoint (no exporter dependencies)
        shell: bash
        run: |
          python -m pip install --no-deps .
          confluencebridge --version
          python -m confluence_dump --version
          confluencebridge version --help
          python -m compileall -q confluence_dump
      - name: Verify actual PEP 610 Git-URL install of exact revision
        if: github.event_name == 'push' && runner.os == 'Linux' && matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install uv
          export UV_TOOL_DIR="${RUNNER_TEMP}/uv-tools"
          export UV_TOOL_BIN_DIR="${RUNNER_TEMP}/uv-bin"
          uv tool install --force --no-deps --python "$(command -v python)" "git+https://github.com/SomeSunlight/ConfluenceBridge.git@${GITHUB_SHA}"
          actual="$("${UV_TOOL_BIN_DIR}/confluencebridge" --version)"
          echo "$actual"
          expected="confluencebridge 3.0.1 (detached@${GITHUB_SHA:0:7})"
          if [[ "$actual" != "$expected" ]]; then
            echo "Expected exact installed Git revision: $expected" >&2
            exit 1
          fi
          uv tool install --force --refresh --no-deps --python "$(command -v python)" "git+https://github.com/SomeSunlight/ConfluenceBridge.git@${GITHUB_REF_NAME}"
          branch_version="$("${UV_TOOL_BIN_DIR}/confluencebridge" --version)"
          echo "$branch_version"
          python - "$branch_version" "${GITHUB_REF_NAME}" <<'PY'
          import re
          import sys
          received, branch = sys.argv[1:]
          assert re.fullmatch(rf"confluencebridge 3[.]0[.]1 \({re.escape(branch)}@[a-f0-9]{{7}}\)", received)
          PY
